name: Refresh Modrinth analytics

on:
  schedule:
    - cron: "23 7 * * *" # daily, 07:23 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-modrinth-analytics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch weekly downloads from Modrinth
        env:
          MODRINTH_ANALYTICS_TOKEN: ${{ secrets.MODRINTH_ANALYTICS_TOKEN }}
        run: node tools/fetch-modrinth-analytics.mjs data/modrinth-downloads.json

      - name: Commit the data file if it changed
        run: |
          if [ -z "$(git status --porcelain -- data/modrinth-downloads.json)" ]; then
            echo "Analytics unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/modrinth-downloads.json
          git commit -m "Refresh Modrinth download analytics"
          git push
